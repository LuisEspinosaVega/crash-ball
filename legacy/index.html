<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crash Ball Arena</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="loading">
        <div class="loading-spinner"></div>
        <p>Conectando a servidor...</p>
    </div>

    <div id="ui" style="display:none;">
        <!-- HUD -->
        <div id="hud">
            <div id="player-count" class="stat">Jugadores: 4</div>
            <div id="round-info" class="stat">Ronda: 1 | Tiempo: 00:00</div>
        </div>

        <!-- Health bars -->
        <div id="health-bars">
            <!-- Health bars generated by JS -->
        </div>

        <!-- Controls hint -->
        <div id="controls">
            <p>← → o A/D: Mover | ENTER / SPACE: Golpear | R: Reiniciar</p>
        </div>
    </div>

    <div id="game-over" style="display:none;">
        <h1 id="game-over-title">Ronda Terminada!</h1>
        <p id="game-over-winner"></p>
        <p id="game-over-score"></p>
        <button id="play-again">Jugar Again</button>
        <button id="restart-game">Reiniciar Partida</button>
    </div>

    <!-- Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
